<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RouteaM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html:root{--dock-reserve:96px}iframe[src^='https://app.netlify.com']{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RouteaM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: gimnàs de pissarra. Capçalera amb les dues persones, pestanyes enganxades a dalt, contingut en una columna, cronòmetre fix a baix. */
:root{
  --dock-reserve:max(16px,env(safe-area-inset-right,0px));
  --bg:#F2F6FF; --surface:#FFFFFF; --surface2:#E6EDFC; --fg:#141B34; --muted:#56607F; --line:#D3DCF2;
  --a:#2F5BFF; --a-soft:#DCE5FF; --b:#E5266F; --b-soft:#FFDCE9; --sun:#FFC93C; --prop:#BCC7E6;
  --ink-on:#FFFFFF; --hl:#F26B1D; --ok:#1E8A4C; --warn:#9A5B00; --warn-soft:#FFF0C2;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ac:var(--a); --ac-soft:var(--a-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1328; --surface:#181D3A; --surface2:#222850; --fg:#EEF1FF; --muted:#9AA4CE; --line:#2E3560;
    --a:#7D9BFF; --a-soft:#1E2B66; --b:#FF7FAF; --b-soft:#4A1A33; --sun:#FFC93C; --prop:#3A4278;
    --ink-on:#0B0F26; --hl:#FF9B5E; --ok:#62C277; --warn:#FFD166; --warn-soft:#3A2F0E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1328; --surface:#181D3A; --surface2:#222850; --fg:#EEF1FF; --muted:#9AA4CE; --line:#2E3560;
  --a:#7D9BFF; --a-soft:#1E2B66; --b:#FF7FAF; --b-soft:#4A1A33; --sun:#FFC93C; --prop:#3A4278;
  --ink-on:#0B0F26; --hl:#FF9B5E; --ok:#62C277; --warn:#FFD166; --warn-soft:#3A2F0E; color-scheme:dark;
}
body[data-p="0"]{--ac:var(--a);--ac-soft:var(--a-soft)}
body[data-p="1"]{--ac:var(--b);--ac-soft:var(--b-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0 170px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.top{padding-block:18px 10px;display:flex;flex-direction:column;gap:12px}
.brand-t{font-family:var(--f-disp);font-weight:700;font-size:2rem;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.brand-s{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;min-width:0}
.who button .dot{width:14px;height:14px;border-radius:50%;flex:none}
.who button b{font-family:var(--f-disp);font-size:1.25rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:1.1}
.who button small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.who button[aria-pressed="true"]{border-color:var(--ac);background:var(--ac-soft)}
.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:760px;margin:0 auto;scrollbar-width:none}
.tabs a{flex:1 0 auto;text-align:center;padding:12px 2px;font-family:var(--f-disp);font-size:.9rem;font-weight:600;text-transform:uppercase;letter-spacing:0;color:var(--muted);text-decoration:none;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--ac)}
main{padding-block:18px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:.95rem;color:var(--muted)}
.title{font-size:2.3rem}
h2{font-size:1.6rem}
h3{font-size:1.25rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:.82rem;font-weight:500}
.chip.ac{background:var(--ac-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--ac)}
.btn{border:2px solid var(--ac);background:var(--ac);color:var(--ink-on);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:10px 8px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--ink-on)}
.note{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:.92rem}
.note .btn{margin-top:8px}
/* calendari */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{text-align:center;font-family:var(--f-disp);font-weight:600;color:var(--muted);text-transform:uppercase;font-size:.9rem;padding-bottom:2px}
.cal button.d{aspect-ratio:1/1.12;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;overflow:hidden}
.cal button.d.out{opacity:.35}
.cal button.d.rest{background:var(--surface2);border-style:dashed}
.cal button.d.today{border:2px solid var(--fg)}
.cal button.d.sel{background:var(--ac);border-color:var(--ac);color:var(--ink-on)}
.cal .n{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;line-height:1}
.cal .l{font-size:.62rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;height:8px}
.dots i{width:8px;height:8px;border-radius:50%;display:block;border:1.5px solid transparent}
.dots i.p0{background:var(--a)}.dots i.p1{background:var(--b)}
.cal button.d.sel .dots i{border-color:var(--ink-on)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.week{display:flex;flex-direction:column}
.week .r{display:grid;grid-template-columns:3.2rem 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.week .r:first-child{border-top:0}
.week .r b{font-family:var(--f-disp);font-size:1.2rem;text-transform:uppercase}
.week .r.rest{color:var(--muted)}
.list{margin:8px 0 0;padding-left:1.1rem}
.list li{margin:2px 0}
/* sessio */
.ex{display:flex;flex-direction:column;gap:10px}
.ex.complete{border-color:var(--ac);box-shadow:inset 4px 0 0 var(--ac)}
.ex .head{display:grid;grid-template-columns:2.2rem 1fr;gap:10px}
.ex .num{font-family:var(--f-disp);font-weight:700;font-size:1.8rem;color:var(--ac);line-height:1}
.ex .name{font-weight:600;font-size:1.05rem;line-height:1.25}
.ex .sx{font-family:var(--f-disp);font-weight:700;font-size:2.4rem;line-height:1;white-space:nowrap}
.ex .sx small{font-family:var(--f-body);font-weight:500;font-size:.85rem;color:var(--muted);margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.setb{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--f-disp);font-weight:700;font-size:1.3rem}
.setb[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--ink-on)}
.hint{font-size:.88rem;color:var(--muted)}
.hint b{color:var(--fg)}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .t{font-weight:600}
/* dieta */
.kcal{font-family:var(--f-disp);font-weight:700;font-size:3.6rem;line-height:1}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);margin:12px 0 8px}
.bar i{display:block}
.bar .p{background:var(--ac)}.bar .c{background:var(--muted)}.bar .f{background:var(--warn)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.macros div{border-top:4px solid var(--line);padding-top:6px}
.macros .p{border-color:var(--ac)}.macros .c{border-color:var(--muted)}.macros .f{border-color:var(--warn)}
.macros b{font-family:var(--f-disp);font-size:1.7rem;display:block;line-height:1}
.opts{display:flex;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-weight:600;min-height:36px}
.opts button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--ink-on)}
.items{list-style:none;margin:8px 0 0;padding:0}
.items li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.items li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
/* progres i perfil */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{font-family:var(--f-disp);font-size:2.4rem;line-height:1;display:block}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600;font-size:.9rem}
.field input,.field select{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.logrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
/* cronòmetre */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--ac);
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  padding-right:calc(var(--dock-reserve) + env(safe-area-inset-right,0px))}
.dock.ring{animation:ring .5s 4}
@keyframes ring{50%{background:var(--ac-soft)}}
@media (prefers-reduced-motion:reduce){.dock.ring{animation:none;background:var(--ac-soft)}}
.dock-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock-main{display:flex;align-items:center;gap:10px}
.dock-time{font-family:var(--f-disp);font-weight:700;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums;min-width:5.2rem}
.dock-label{flex:1;min-width:0;font-size:.85rem;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.ib{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib.go{background:var(--ac);border-color:var(--ac);color:var(--ink-on)}
.ib svg{width:20px;height:20px;fill:currentColor}
.presets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.presets button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;min-height:32px}
.presets .mode{margin-left:auto;border-color:var(--ac)}

.brandrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand-t span{background:linear-gradient(transparent 58%,var(--sun) 58%);padding:0 4px;margin-left:-4px}
.syn{font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.syn:empty{display:none}
.syn.ok{background:var(--ac-soft)}.syn.err{background:var(--warn-soft);color:var(--warn)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;font-weight:700;letter-spacing:.06em;background:var(--surface2);border-radius:8px;padding:10px 12px;word-break:break-all;user-select:all}
.figbox{background:var(--surface2);border-radius:10px;padding:10px 10px 8px}
svg.fig{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
svg.fig.one{max-width:150px}
.figtip{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
.figtip b{color:var(--fg)}
.card.hero{border:2px solid var(--ac);background:var(--ac-soft)}
.card.hero h2{font-size:2rem}
.week button.r{background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%;color:inherit;border-radius:0;padding-inline:4px}
.week button.r:first-child{border-top:0}
.week button.r.on{background:var(--ac-soft)}

/* Mòbil */
html{-webkit-text-size-adjust:100%}
button,a,select,input{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent}
.top{padding-block:12px 8px;gap:10px}
.brand-t{font-size:2rem;text-transform:none;letter-spacing:.01em}
.brand-s{font-size:.82rem}
.who button{padding:8px 10px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible}
.tabs a{flex:none;padding:13px 0;font-size:clamp(.78rem,3.7vw,.98rem);letter-spacing:0;white-space:nowrap}
main{padding-block:14px}
.dock{padding-top:8px}
.dock-time{font-size:2.3rem;min-width:4.3rem}
.dock-main{gap:8px}
.ib{width:44px;height:44px}
.presets{flex-wrap:wrap;overflow:visible}
.presets button{min-height:36px}
.figbox{padding:8px 8px 6px}
.cal button.d{min-height:46px}
@media (max-width:380px){
  .title{font-size:2rem}
  .brand-t{font-size:1.7rem}
  .who button small{display:none}
  .ex .sx{font-size:2.1rem}
  .setb{width:46px;height:46px}
}
@media (min-width:700px){
  .cal button.d{aspect-ratio:1/0.8}
}

/* guia d'exercici */
svg.fig text{font-family:var(--f-body);font-size:7px;fill:var(--muted);font-weight:600;letter-spacing:.04em}
.figlegend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:4px 0 2px;font-size:.78rem;color:var(--muted)}
.figlegend .lg{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:-4px}
.lg-hl{background:var(--hl)}.lg-gh{background:var(--fg);opacity:.25}
.lg-ar{width:auto!important;height:auto!important;background:none;color:var(--ac);font-weight:700;margin-right:-6px!important}
.gh{font-family:var(--f-disp);font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px;color:var(--ac)}
.steps{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:6px}
.steps li{padding-left:2px}
.steps li::marker{font-family:var(--f-disp);font-weight:700;color:var(--ac)}
.keytip{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--fg);border-left:4px solid var(--sun)}
.avoid{margin:8px 0 0;font-size:.92rem;color:var(--muted)}
details.more{margin-top:8px;border-top:1px solid var(--line)}
details.more summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600;color:var(--ac)}
details.more p{margin:0 0 8px;font-size:.92rem}
.chip.ss{margin-top:6px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--sun);font-weight:600}
.optnav{display:flex;align-items:center;gap:8px;margin-top:8px}
.optnav button{min-width:46px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 1.2rem var(--f-body);cursor:pointer}
.optnav .cnt{flex:1;text-align:center;font-size:.9rem;color:var(--muted);font-weight:600}
.seg.wrap{flex-wrap:wrap}
.pcol{min-width:0;display:flex;flex-direction:column;gap:2px}
.pw{font-family:var(--f-disp);font-size:2rem;font-weight:800;line-height:1.1}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;padding:4px 0;border-bottom:1px solid var(--line)}
.pl b{font-weight:700;font-size:inherit;display:inline}
</style>

</head>
<body>
<div class="wrap">
  <div class="top" id="top"></div>
  <div class="tabsbar"><nav class="tabs" id="tabs" aria-label="Seccions"></nav></div>
  <main id="main"></main>
</div>

<div class="dock" id="dock" role="timer" aria-label="Cronòmetre">
  <div class="dock-in">
    <div class="dock-main">
      <div class="dock-time" id="tmTime">00:00</div>
      <div class="dock-label" id="tmLabel">Cronòmetre</div>
      <button class="ib" id="tmMore" type="button" aria-expanded="false" aria-controls="presets" aria-label="Més opcions del cronòmetre"><svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
      <button class="ib" id="tmReset" type="button" aria-label="Reiniciar"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg></button>
      <button class="ib go" id="tmPlay" type="button" aria-label="Iniciar"><svg id="tmIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
    <div class="presets" id="presets" hidden>
      <button type="button" data-t="30">30 s</button><button type="button" data-t="45">45 s</button><button type="button" data-t="60">1 min</button><button type="button" data-t="90">1:30</button><button type="button" data-t="120">2 min</button>
      <button type="button" id="tmAdd" aria-label="Afegir 15 segons">+15 s</button>
      <button type="button" class="mode" id="tmMode">Passar a crono</button>
    </div>
  </div>
</div>
<script>
/* Dibuixos d'exercicis: figures de pal amb cinemàtica inversa. Cada patró té 1 o 2 fotogrames. */
var Figs=(function(){
'use strict';
var GY=92,TORSO=30,TH=22,SH=22,UA=14,FA=14;
var HLC={};
function cl(part){return HLC[part]?'hl':'fg';}
function pw(part,w){return HLC[part]?w+0.8:w;}
function pol(a,l){var r=a*Math.PI/180;return [Math.cos(r)*l,Math.sin(r)*l];}
function add(p,q){return [p[0]+q[0],p[1]+q[1]];}
function r1(n){return Math.round(n*10)/10;}
function ik(p0,p1,l1,l2,hint){
  var dx=p1[0]-p0[0],dy=p1[1]-p0[1],d=Math.sqrt(dx*dx+dy*dy)||0.01;
  var dd=Math.min(d,l1+l2-0.05),ux=dx/d,uy=dy/d;

function build(P,pl,di,noCut){
  var MAXEX=10,SWITCH=10;
  var G=GOALS[P.goal],pr=prog(P,di),ov=pl.over||{},R=ov.r||G.r,sets0=ov.sets||G.sets,rest0=ov.rest||G.rest;
  var cm=pl.cardio?pl.cardio.mins[goalIdx(P)]:0,budget=3000-600-cm*60,used=0,list=[];
  var seen={},cand=pickPool(pl,di).filter(function(e){var n=variant(e,P).n;if(seen[n])return false;seen[n]=1;return true;}),k=0,pi=0;
  function mk(e){
    if(pr.b%2===1&&e.alt)e=e.alt;
    var vr=variant(e,P),lo=R[0]+(pr.c===1?2:0),hi=R[1]+(pr.c===1?2:0),rn=(lo+hi)/2;
    var tt=vr.t?vr.t+(pr.c===1?5:0):0;
    return {e:e,vr:vr,reps:lo===hi?''+lo:lo+'–'+hi,t:tt,work:(tt||rn*3),rest:vr.t?30:rest0};
  }
  while(k<cand.length&&list.length<MAXEX){
    var s=Math.max(2,sets0+(pr.c===2&&pi<2?1:0)-(pr.c===3&&!noCut?1:0));
    var A=mk(cand[k]),B=(k+1<cand.length&&list.length+2<=MAXEX)?mk(cand[k+1]):null;
    var pair=B?s*(A.work+B.work+SWITCH+Math.max(A.rest,B.rest)):0,one=s*(A.work+A.rest);
    if(B&&(list.length<4||used+pair<=budget)){
      var rr=Math.max(A.rest,B.rest);
      list.push({e:A.e,vr:A.vr,i:list.length,sets:s,reps:A.reps,t:A.t,rest:SWITCH,ss:pi,pos:0,secs:0});
      list.push({e:B.e,vr:B.vr,i:list.length,sets:s,reps:B.reps,t:B.t,rest:rr,ss:pi,pos:1,secs:pair});
      used+=pair;k+=2;pi++;
    }else if(list.length<4||used+one<=budget){
      list.push({e:A.e,vr:A.vr,i:list.length,sets:s,reps:A.reps,t:A.t,rest:A.rest,ss:-1,pos:0,secs:one});used+=one;k++;pi++;break;

function figBox(id,label){
  if(!id||!Figs.has(id))return '';
  var G=GUIDE[id],h='<div class="figbox">'+Figs.svg(id,{label:'Dibuix: '+label});
  if(Figs.two(id))h+='<p class="figlegend"><span class="lg lg-hl"></span>Zona que treballa <span class="lg lg-gh"></span>Posició inicial <span class="lg lg-ar">➜</span>Moviment</p>';
  if(!G){return h+'<p class="figtip"><b>Tècnica:</b> '+esc(Figs.tip(id))+'</p>'+(ERRS[id]?'<p class="figtip"><b>Evita:</b> '+esc(ERRS[id])+'</p>':'')+'</div>';}
  h+='<h4 class="gh">Com es fa</h4><ol class="steps">';
  G.steps.forEach(function(s){h+='<li>'+esc(s)+'</li>';});
  h+='</ol><p class="keytip"><b>Clau:</b> '+esc(G.tip)+'</p>';
  h+='<p class="avoid"><b>Evita:</b> '+G.err.map(esc).join(' · ')+'</p>';
  h+='<details class="more"><summary>Respiració i variants</summary><p><b>Respiració:</b> '+esc(G.resp)+'</p><p><b>Més fàcil:</b> '+esc(G.easy)+'</p><p><b>Més difícil:</b> '+esc(G.hard)+'</p></details>';
  return h+'</div>';
}
function viewSessio(P){
  var di=UI.sel,info=dayInfo(P,di),pl=info.plan,c=calc(P);
  var h=sampleNote(P);
  if(pl.rest){
    h+='<div class="card"><div class="eyebrow">'+longDate(di)+' · Dia 7</div><h1 class="title">'+pl.title+'</h1><p>'+pl.desc+'</p><ul class="list"><li>Beu uns '+fmt(c.water)+' L d’aigua repartits durant el dia.</li><li>Dorm entre 7 i 9 hores.</li><li>Pots canviar el dia de descans de la setmana al Calendari.</li></ul></div>';
    h+=strBlock(pl.str,'Mobilitat');
    return h;
  }
  var B=build(P,pl,di),pr=B.pr,fa=fatigue(P),mul=pr.loadMul*fa.m;
  h+='<div class="card"><div class="eyebrow">'+longDate(di)+' · Dia '+info.n+' de la rutina</div><h1 class="title">'+pl.title+'</h1><p style="margin:4px 0 0"><b>Treballem:</b> '+pl.mus+'</p>';
  h+='<div class="row" style="margin:10px 0"><span class="chip ac">≈ '+B.min+' min</span><span class="chip">5 min escalfament</span><span class="chip">5 min estiraments</span>'+(pl.optional?'<span class="chip">Opcional</span>':'')+'<span class="chip">'+GOALS[P.goal].label+'</span><span class="chip">'+(P.mat==='weights'?'Amb pesos':'Pes corporal')+'</span></div>';
  h+='<div class="seg" role="group" aria-label="On entrenes"><button type="button" data-a="mode" data-m="gym" aria-pressed="'+(P.mode==='gym')+'">Gimnàs</button><button type="button" data-a="mode" data-m="home" aria-pressed="'+(P.mode==='home')+'">Casa</button></div></div>';

}

function weightChart(log){
  var L=log.slice().sort(function(a,b){return a.d<b.d?-1:1;});
  if(L.length<2)return '<p class="muted">Apunta el teu pes cada setmana i aquí veuràs com evoluciona. Amb dos registres ja apareix la gràfica.</p>';
  var W=320,H=150,pl=34,pr=10,pt=10,pb=24,ws=L.map(function(e){return e.kg;});
  var mn=Math.floor(Math.min.apply(null,ws)-1),mx=Math.ceil(Math.max.apply(null,ws)+1);
  var t0=parse(L[0].d).getTime(),t1=parse(L[L.length-1].d).getTime(),span=Math.max(1,t1-t0);
  function X(d){return pl+(parse(d).getTime()-t0)/span*(W-pl-pr);}
  function Y(k){return pt+(mx-k)/(mx-mn)*(H-pt-pb);}
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolució del pes">';
  [mn,(mn+mx)/2,mx].forEach(function(k){svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(k)+'" y2="'+Y(k)+'" style="stroke:var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(Y(k)+3)+'" text-anchor="end">'+fmt(k)+'</text>';});
  svg+='<polyline fill="none" style="stroke:var(--ac)" stroke-width="2.5" stroke-linejoin="round" points="'+L.map(function(e){return X(e.d).toFixed(1)+','+Y(e.kg).toFixed(1);}).join(' ')+'"/>';
  L.forEach(function(e,i){svg+='<circle cx="'+X(e.d).toFixed(1)+'" cy="'+Y(e.kg).toFixed(1)+'" r="'+(i===L.length-1?5:3)+'" style="fill:var(--ac)"/>';});
  var a=parse(L[0].d),b=parse(L[L.length-1].d);
  svg+='<text x="'+pl+'" y="'+(H-6)+'">'+a.getDate()+' '+MONTHS[a.getMonth()].slice(0,3)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+b.getDate()+' '+MONTHS[b.getMonth()].slice(0,3)+'</text></svg>';
  return svg;
}

function streak(i){

}
function setView(v,noScroll){
  if(!VIEWS.some(function(x){return x[0]===v;}))v='calendari';
  UI.view=v;render();
  if(!noScroll)window.scrollTo(0,0);
}
function upsertW(P,kg){P.log=P.log.filter(function(e){return e.d!==TODAY;});P.log.push({d:TODAY,kg:kg});P.weight=kg;}

/* ---------- Esdeveniments ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,P=cur(),ci=S.cur;
  if(a==='who'){S.cur=+b.dataset.i;save();render();}
  else if(a==='go'){location.hash=b.dataset.v;}
  else if(a==='mon'){UI.cm+=+b.dataset.d;if(UI.cm<0){UI.cm=11;UI.cy--;}if(UI.cm>11){UI.cm=0;UI.cy++;}render();}
  else if(a==='sel'){UI.sel=b.dataset.d;render();}
  else if(a==='open'){location.hash='sessio';}
  else if(a==='start'){UI.sel=b.dataset.d;if(location.hash==='#sessio'){render();window.scrollTo(0,0);}else location.hash='sessio';}
  else if(a==='next'){UI.sel=nextTrainingDate(P,UI.sel);render();window.scrollTo(0,0);}
  else if(a==='fb'){P.fb[UI.sel]=b.dataset.v;touch(ci);render();}
  else if(a==='mode'){P.mode=b.dataset.m;touch(ci);render();}
  else if(a==='tm'){tmSet(+b.dataset.s,b.dataset.l,true);}
  else if(a==='set'){
    var day=(P.sets[UI.sel]=P.sets[UI.sel]||{}),i=b.dataset.i,n=+b.dataset.n,cnt=day[i]||0;
    var tot=+b.dataset.tot||1;
    if(cnt>=n){day[i]=n-1;}else{day[i]=n;if(n<tot&&+b.dataset.r>0)tmSet(+b.dataset.r,'Descans',true);}
    touch(ci);render();
  }
  else if(a==='done'){P.done[UI.sel]=!P.done[UI.sel];touch(ci);render();}
  else if(a==='diet'){P.diet=b.dataset.v;touch(ci);render();}
  else if(a==='optn'||a==='optr'||a==='optall'){
    var dd=parse(UI.sel),dnn=Math.floor(Date.UTC(dd.getFullYear(),dd.getMonth(),dd.getDate())/864e5),dt=P.diet||'tot';
    var ms=a==='optall'?MEALS.map(function(_,q){return q;}):[+b.dataset.m];
    ms.forEach(function(mi){
      var M=MEALS[mi],al=mealAllowed(M,dt),key=UI.sel+'#'+mi,ov=P.opt[key],cur=(ov!=null&&al.indexOf(ov)>=0)?ov:al[(dnn+mi*3)%al.length],nx;
      if(a==='optn'){var p=al.indexOf(cur);nx=al[(p+(+b.dataset.d)+al.length)%al.length];}
      else{do{nx=al[Math.floor(Math.random()*al.length)];}while(al.length>1&&nx===cur);}
      P.opt[key]=nx;
    });
    touch(ci);render();
  }
  else if(a==='goal'){P.goal=b.dataset.g;P.custom=true;touch(ci);render();}
  else if(a==='rest'){var mon=b.dataset.mon;P.rest[mon]=P.rest[mon]||{};P.rest[mon].d=+b.dataset.w;touch(ci);render();}
  else if(a==='restauto'){var m2=b.dataset.mon;if(P.rest[m2]){delete P.rest[m2].d;}touch(ci);render();}
  else if(a==='addw'){var v=parseFloat(document.getElementById('wIn').value);if(v>=30&&v<=250){upsertW(P,Math.round(v*10)/10);P.custom=true;touch(ci);render();}}
  else if(a==='delw'){P.log=P.log.filter(function(x){return x.d!==b.dataset.d;});touch(ci);render();}
  else if(a==='syngen'||a==='syncgen'){UI.codeDraft=genCode();UI.syncErr='';render();}
  else if(a==='syncon'){
    var code=(document.getElementById('syncCode').value||'').trim();
    UI.codeDraft=code;
    if(code.replace(/[\s-]/g,'').length<8){UI.syncErr='El codi ha de tenir almenys 8 caràcters.';render();return;}
    UI.syncErr='';S.sync.code=code;UI.codeDraft='';save();SY.state='sync';render();syncNow().then(function(){if(UI.view==='perfil')render();});
  }
  else if(a==='syncnow'){syncNow().then(function(){if(UI.view==='perfil')render();});}
  else if(a==='syncoff'){S.sync.code='';SY.state='off';SY.msg='';save();render();}
  else if(a==='reset1'){UI.confirm=true;render();}
  else if(a==='reset0'){UI.confirm=false;render();}
  else if(a==='reset2'){
    var keep=S.sync;S=defaults();S.sync=keep;S.people.forEach(function(Q){Q.ts=Date.now();});
    UI.confirm=false;save();schedulePush();render();
  }
});
document.addEventListener('change',function(e){
  var t=e.target,ci=S.cur,P=cur();
  if(t.id==='restAct'){var mon=t.getAttribute('data-ra');P.rest[mon]=P.rest[mon]||{};P.rest[mon].a=+t.value;touch(ci);render();return;}
  var f=t.getAttribute('data-f');if(!f)return;
  var v=t.value;
  if(f==='name'){P.name=v.trim()||P.name;}
  else if(f==='sex'||f==='level'||f==='restPref'||f==='mat'){P[f]=v;}
  else if(f==='weight'){var k=parseFloat(v);if(k>=30&&k<=250)upsertW(P,Math.round(k*10)/10);}
  else{var n=parseFloat(v);if(!isNaN(n))P[f]=n;}
  if(f!=='restPref'&&f!=='mat')P.custom=true;
  touch(ci);render();
});
window.addEventListener('hashchange',function(){setView(location.hash.replace('#',''));});

var WL=null;
function wake(){
  try{
    if(UI.view!=='sessio'){if(WL){WL.release();WL=null;}return;}
    if(navigator.wakeLock&&!document.hidden&&!WL){navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null;});}).catch(function(){});}
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)wake();});
var elMore=document.getElementById('tmMore'),elPre=document.getElementById('presets');
function fitDock(){document.body.style.paddingBottom=(elDock.offsetHeight+24)+'px';}
elMore.addEventListener('click',function(){var open=elPre.hidden;elPre.hidden=!open;elMore.setAttribute('aria-expanded',open?'true':'false');fitDock();});
if(window.ResizeObserver)new ResizeObserver(fitDock).observe(elDock);
fitDock();
setView(location.hash.replace('#','')||'calendari',true);
tmDraw();
if(S.sync.code)syncNow();
})();
