<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>El que el bàsquet ha juntat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23E4570F' stroke-width='2.4'%3E%3Ccircle cx='16' cy='16' r='13'/%3E%3Cpath d='M3 16h26M16 3v26M6.2 6.6c4.6 3.4 4.6 15.4 0 18.8M25.8 6.6c-4.6 3.4-4.6 15.4 0 18.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app">
  <header class="head">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M3 16h26M16 3v26M6.2 6.6c4.6 3.4 4.6 15.4 0 18.8M25.8 6.6c-4.6 3.4-4.6 15.4 0 18.8"/></svg>
      <h1>El que el bàsquet ha juntat</h1>
    </div>
    <div class="row"><button class="link" id="btn-colors" hidden>Color</button><button class="link" id="btn-names" hidden>Noms</button><button class="link" id="btn-out" hidden>Sortir</button></div>
  </header>
  <div id="top"></div>
  <div id="board"></div>
  <div id="colors"></div>
  <div id="games"></div>
  <div id="addzone"></div>
  <div id="rewards"></div>
  <section class="card" id="wallcard" hidden>
    <h2>Mur de frases</h2>
    <div class="wall" id="wall"></div>
  </section>
  <p class="tiny" style="text-align:center;margin:0">Els punts de les frases se'ls emporta qui les ha dit i els suma qui les ha rebudes. Els jocs sumen a qui juga.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
