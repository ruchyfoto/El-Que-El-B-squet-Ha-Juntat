<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>El que el bàsquet ha juntat</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4A1630">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bàsquet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="app">
  <header class="head">
    <div class="brand">
      <img class="logo" src="logo.jpg" width="44" height="44" alt="">
      <h1>El que el bàsquet ha juntat</h1>
    </div>
    <div class="row"><button class="link" id="btn-push" hidden>Avisos</button><button class="link" id="btn-colors" hidden>Color</button><button class="link" id="btn-names" hidden>Noms</button><button class="link" id="btn-out" hidden>Sortir</button></div>
  </header>
  <div id="top"></div>
  <div id="board"></div>
  <div id="meet"></div>
  <div id="chat"></div>
  <div id="cal"></div>
  <button class="btn cta" id="btn-letter" type="button" hidden>✉ Escriure una carta</button>
  <div id="letters"></div>
  <div id="colors"></div>
  <div id="pushzone"></div>
  <div id="games"></div>
  <div id="c4"></div>
  <div id="hugs"></div>
  <div id="kisses"></div>
  <div id="surp"></div>
  <div id="shop"></div>
  <div id="addzone"></div>
  <div id="rewards"></div>
  <section class="card" id="wallcard" hidden>
    <h2>Mur de frases</h2>
    <div class="wall" id="wall"></div>
  </section>
  <p class="tiny" style="text-align:center;margin:0">Els punts de les frases se'ls emporta qui les ha dit i els suma qui les ha rebudes. Els jocs sumen a qui juga.</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
